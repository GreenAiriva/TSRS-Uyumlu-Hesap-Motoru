<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Karbon Ayak İzi Hesap Motoru — TSRS Uyumlu</title>
<link rel="stylesheet" href="css/stil.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect y='0' width='32' height='9' fill='%23B4642D'/%3E%3Crect y='9' width='32' height='9' fill='%231F7A63'/%3E%3Crect y='18' width='32' height='9' fill='%235B6B7C'/%3E%3Crect y='27' width='32' height='5' fill='%2323282D'/%3E%3C/svg%3E">
</head>
<body>
<noscript>
  <div style="max-width:560px;margin:80px auto;font-family:sans-serif;padding:24px;border:1px solid #ccc">
    <h2>JavaScript gerekli</h2>
    <p>Bu uygulamanın çalışması için tarayıcınızda JavaScript'in açık olması gerekir. Lütfen JavaScript'i etkinleştirip sayfayı yenileyin.</p>
  </div>
</noscript>

<div id="uygulama" class="uygulama" aria-live="polite"></div>

<!-- ============ DÜZENLENEBİLİR VERİ DOSYALARI (data/ klasörü) ============
     Sıralama önemli değildir; hepsi window.VERI altına yazar. -->
<script src="data/ayarlar.js"></script>
<script src="data/listeler.js"></script>
<script src="data/tsrs_modulleri.js"></script>
<script src="data/sektor_ciltleri.js"></script>
<script src="data/ef_kaynaklari.js"></script>
<script src="data/kip_ar6.js"></script>
<script src="data/ef_sabit_yanma.js"></script>
<script src="data/ef_mobil_yakit.js"></script>
<script src="data/ef_mobil_mesafe.js"></script>
<script src="data/ef_tasimacilik.js"></script>
<script src="data/ef_toplu_tasima.js"></script>
<script src="data/ef_elektrik.js"></script>
<script src="data/kacak_oranlari.js"></script>
<script src="data/yakit_ekonomisi.js"></script>

<!-- ============ BULUT ALTYAPISI ============
     Supabase istemcisi (çok-kullanıcılı veritabanı + kimlik) ve JSON Patch (geri al).
     Yerel kopyalar (js/vendor/) — CDN bağımlılığı yok, çevrimdışı yüklenir; yalnız
     veritabanı çağrıları internet gerektirir. -->
<script src="js/vendor/supabase.min.js"></script>
<script src="js/vendor/fast-json-patch.min.js"></script>
<script src="js/sb.js?v=3"></script>

<!-- ============ UYGULAMA ÇEKİRDEĞİ (js/ klasörü) ============
     Sıralama önemlidir: depo → motor → arayüz → sayfalar → auth (bootstrap)
     ?v=N sürüm damgası: dağıtımda artırınca istemciler önbellekteki eski
     sürüm yerine güncel dosyayı çeker. -->
<script src="js/depo.js?v=3"></script>
<script src="js/motor.js?v=3"></script>
<script src="js/arayuz.js?v=3"></script>
<script src="js/panel.js?v=3"></script>
<script src="js/rapor.js?v=3"></script>
<script src="js/admin.js?v=3"></script>
<script src="js/auth.js?v=3"></script>

<script>
document.addEventListener("DOMContentLoaded", function () {
  try {
    App.basla();
  } catch (hata) {
    document.getElementById("uygulama").innerHTML =
      "<div style='max-width:640px;margin:60px auto;padding:24px;font-family:sans-serif;border:1px solid #B3402E;border-radius:4px'>" +
      "<h2 style='color:#B3402E'>Uygulama başlatılamadı</h2>" +
      "<p>Büyük olasılıkla data/ klasöründeki bir dosyada yazım hatası var (eksik virgül veya tırnak). " +
      "Son düzenlediğiniz dosyayı kontrol edin ya da yedeğinizden geri yükleyin.</p>" +
      "<pre style='background:#f5f5f5;padding:12px;overflow:auto;font-size:12px'>" +
      String(hata && hata.message ? hata.message : hata).replace(/</g, "&lt;") + "</pre></div>";
  }
});
</script>
</body>
</html>
